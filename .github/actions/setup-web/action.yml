name: Set up web toolchain
description: Install the pinned Node and pnpm, then the web dependencies.

inputs:
  cache:
    description: Cache web dependencies.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: web/package.json
    # Kept in step with mise.toml.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.0
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm --dir web install --frozen-lockfile
      shell: bash
