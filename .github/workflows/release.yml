name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

cache-mode: none

jobs:
  source:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require a release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "not a release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.revision }}
      release-artifacts: true

  # Smokes the native minimal and documents images, then publishes an amd64/arm64
  # manifest of each. Existing full-version tags are never overwritten.
  container-release:
    needs: [source, ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: container-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/savorum/savorum
      REVISION: ${{ needs.source.outputs.revision }}
      WEB_BUNDLE_SHA256: ${{ needs.ci.outputs.web-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - name: Require the tested web artifact
        env:
          ARTIFACT_ID: ${{ needs.ci.outputs.web-artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci.outputs.web-artifact-id }}
          path: ${{ runner.temp }}/web-artifact
      - name: Verify the tested web bundle
        working-directory: ${{ runner.temp }}/web-artifact
        run: |
          [[ "$WEB_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  webui.tar\n' "$WEB_BUNDLE_SHA256" | sha256sum --check --strict
          WEB_BUILD_CONTEXT="$RUNNER_TEMP/release-web"
          mkdir -p "$WEB_BUILD_CONTEXT/src/internal/webui"
          tar -xf webui.tar -C "$WEB_BUILD_CONTEXT/src/internal/webui"
          echo "WEB_BUILD_CONTEXT=$WEB_BUILD_CONTEXT" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - run: docker buildx build --pull --load --build-context "web=$WEB_BUILD_CONTEXT" --build-arg "WEB_BUNDLE_SHA256=$WEB_BUNDLE_SHA256" --build-arg VERSION="${RELEASE_TAG#v}" --build-arg REVISION="$REVISION" --tag "savorum:release-smoke-$REVISION" .
      - run: ./scripts/container-smoke-test.sh "savorum:release-smoke-$REVISION"
      - run: docker buildx build --pull --load --target documents --build-context "web=$WEB_BUILD_CONTEXT" --build-arg "WEB_BUNDLE_SHA256=$WEB_BUNDLE_SHA256" --build-arg VERSION="${RELEASE_TAG#v}" --build-arg REVISION="$REVISION" --tag "savorum:release-smoke-documents-$REVISION" .
      - run: ./scripts/container-smoke-test.sh "savorum:release-smoke-documents-$REVISION"
      - name: Require the document tools
        run: |
          docker run --rm --entrypoint sh "savorum:release-smoke-documents-$REVISION" -c \
            'for tool in pdfinfo pdftotext pdftoppm tesseract; do command -v "$tool" || exit 1; done'
          docker run --rm --entrypoint tesseract "savorum:release-smoke-documents-$REVISION" --list-langs | grep -qx eng
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: minimal
        env:
          METADATA_FILE: ${{ runner.temp }}/minimal.json
        run: |
          ./scripts/publish-container.sh
          echo "digest=$(jq -r '."containerimage.digest"' "$METADATA_FILE")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.minimal.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - id: documents
        env:
          TARGET: documents
          VARIANT: documents
          METADATA_FILE: ${{ runner.temp }}/documents.json
        run: |
          ./scripts/publish-container.sh
          echo "digest=$(jq -r '."containerimage.digest"' "$METADATA_FILE")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.documents.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  sbom:
    needs: [source, ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.sbom.outputs.sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-web
        with:
          cache: "false"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
      - name: Write the SBOM
        id: sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir "$RUNNER_TEMP/assets"
          scripts/release-sbom.sh "${RELEASE_TAG#v}" "$RUNNER_TEMP/assets/savorum-${RELEASE_TAG#v}.spdx.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/assets/savorum-${RELEASE_TAG#v}.spdx.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assets/*.spdx.json
          if-no-files-found: error
          retention-days: 1

  github-release:
    needs: [source, container-release, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SBOM_SHA256: ${{ needs.sbom.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag revision
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: Require the prepared SBOM artifact
        env:
          ARTIFACT_ID: ${{ needs.sbom.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.artifact-id }}
          path: ${{ runner.temp }}/assets
      - name: Verify the SBOM
        working-directory: ${{ runner.temp }}/assets
        run: |
          [[ "$SBOM_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  savorum-%s.spdx.json\n' "$SBOM_SHA256" "${RELEASE_TAG#v}" | sha256sum --check --strict
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*.spdx.json
      - name: Attach the signature
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/assets/savorum-${RELEASE_TAG#v}.spdx.json.sigstore.json"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Savorum ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}" \
            "$RUNNER_TEMP"/assets/*
