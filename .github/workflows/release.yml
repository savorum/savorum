name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

cache-mode: none

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

  # Smokes the native minimal and documents images, then publishes an amd64/arm64
  # manifest of each. Existing full-version tags are never overwritten.
  container-release:
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: container-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/savorum/savorum
    steps:
      - name: Require a release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "not a release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Record the release revision
        run: echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - run: docker buildx build --pull --load --build-arg VERSION="${RELEASE_TAG#v}" --build-arg REVISION="$REVISION" --tag "savorum:release-smoke-$REVISION" .
      - run: ./scripts/container-smoke-test.sh "savorum:release-smoke-$REVISION"
      - run: docker buildx build --pull --load --target documents --build-arg VERSION="${RELEASE_TAG#v}" --build-arg REVISION="$REVISION" --tag "savorum:release-smoke-documents-$REVISION" .
      - run: ./scripts/container-smoke-test.sh "savorum:release-smoke-documents-$REVISION"
      - name: Require the document tools
        run: |
          docker run --rm --entrypoint sh "savorum:release-smoke-documents-$REVISION" -c \
            'for tool in pdfinfo pdftotext pdftoppm tesseract; do command -v "$tool" || exit 1; done'
          docker run --rm --entrypoint tesseract "savorum:release-smoke-documents-$REVISION" --list-langs | grep -qx eng
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: minimal
        env:
          METADATA_FILE: ${{ runner.temp }}/minimal.json
        run: |
          ./scripts/publish-container.sh
          echo "digest=$(jq -r '."containerimage.digest"' "$METADATA_FILE")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.minimal.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - id: documents
        env:
          TARGET: documents
          VARIANT: documents
          METADATA_FILE: ${{ runner.temp }}/documents.json
        run: |
          ./scripts/publish-container.sh
          echo "digest=$(jq -r '."containerimage.digest"' "$METADATA_FILE")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.documents.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # Mirrors SREF: the release is created from the tag once its images exist.
  # It carries an SPDX SBOM of the binary's Go modules and web UI packages, with
  # a Sigstore bundle that `gh attestation verify` checks.
  github-release:
    needs: container-release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-web
        with:
          cache: "false"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
      - name: Write the SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir "$RUNNER_TEMP/assets"
          scripts/release-sbom.sh "${RELEASE_TAG#v}" "$RUNNER_TEMP/assets/savorum-${RELEASE_TAG#v}.spdx.json"
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*.spdx.json
      - name: Attach the signature
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/assets/savorum-${RELEASE_TAG#v}.spdx.json.sigstore.json"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Savorum ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}" \
            "$RUNNER_TEMP"/assets/*
