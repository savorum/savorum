name: Prepare release containers

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      web-artifact-id:
        required: true
        type: string
      web-sha256:
        required: true
        type: string
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      manifest-sha256:
        value: ${{ jobs.build.outputs.manifest-sha256 }}

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REVISION: ${{ inputs.ref }}
      WEB_BUNDLE_SHA256: ${{ inputs.web-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require the tested web artifact
        env:
          ARTIFACT_ID: ${{ inputs.web-artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.web-artifact-id }}
          path: ${{ runner.temp }}/web-artifact
      - name: Verify the tested web bundle
        working-directory: ${{ runner.temp }}/web-artifact
        run: |
          [[ "$WEB_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  webui.tar\n' "$WEB_BUNDLE_SHA256" | sha256sum --check --strict
          WEB_BUILD_CONTEXT="$RUNNER_TEMP/release-web"
          mkdir -p "$WEB_BUILD_CONTEXT/src/internal/webui"
          tar -xf webui.tar -C "$WEB_BUILD_CONTEXT/src/internal/webui"
          echo "WEB_BUILD_CONTEXT=$WEB_BUILD_CONTEXT" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - run: ./scripts/prepare-containers.sh "$RUNNER_TEMP/images"
      - id: manifest
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/images/images.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
